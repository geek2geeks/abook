# Publishes the ABook production image to Docker Hub.
# Manual only: the Owner starts it from the Actions tab, and the `dockerhub`
# environment approval gate must be satisfied before anything is pushed.
# Public repository + self-hosted runner: manual dispatch is the only trigger, so
# a commit or a fork can never publish or execute code on the local machine.
name: Publish Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  IMAGE_NAME: abook

jobs:
  publish:
    name: Build and push multi-arch image
    runs-on: [self-hosted, Windows, X64, abook]
    environment: dockerhub
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read app version
        id: version
        run: |
          $version = (Get-Content -Raw -Path VERSION).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'VERSION file is empty' }
          "value=$version" >> $env:GITHUB_OUTPUT

      # Docker Desktop on the runner provides the binfmt/QEMU emulation that
      # buildx uses for linux/arm64, so the Windows runner needs no extra
      # emulation setup step.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
